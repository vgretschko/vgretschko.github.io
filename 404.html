<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404: Off the equilibrium path | Vitali Gretschko</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add("js");
      var t = null;
      try { t = localStorage.getItem("vg-theme"); } catch (e) { }
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      d.setAttribute("data-theme", t);
      var s = null;
      try { s = localStorage.getItem("vg-skin"); } catch (e) { }
      if (["corten", "blackboard", "swiss", "terminal"].indexOf(s) === -1) s = "corten";
      d.setAttribute("data-skin", s);
    })();
  </script>

  <link rel="stylesheet" href="/styles.css?v=7" />
</head>

<body>
  <main class="notfound">
    <div class="notfound-code">404</div>
    <h1>You are off the equilibrium path.</h1>
    <p>No rational player would ever reach this node, yet here we are. Beliefs at this information set are
      unrestricted, so feel free to believe the page you wanted is one click away.</p>
    <a class="btn primary" href="/">Back-induct to the homepage</a>
  </main>
</body>

</html>
